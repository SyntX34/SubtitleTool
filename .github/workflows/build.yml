name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

env:
  BUILD_TYPE: Release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download prebuilt FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full-shared.7z" -OutFile "ffmpeg.7z"
          7z x ffmpeg.7z -oC:\ffmpeg-extract | Out-Null
          $dir = Get-ChildItem C:\ffmpeg-extract | Select-Object -First 1
          Move-Item $dir.FullName C:\ffmpeg
          echo "FFMPEG_ROOT=C:\ffmpeg" >> $env:GITHUB_ENV

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          # Chocolatey is pre-installed on GitHub Actions Windows runners
          choco install vulkan-sdk -y --no-progress
          # Chocolatey sets up VULKAN_SDK env var automatically for subsequent steps
          # But we also set it explicitly to ensure cmake finds it
          $sdkDir = &"C:\ProgramData\chocolatey\bin\refreshenv.cmd" 2>$null; $null
          # The Vulkan SDK installs into C:\VulkanSDK\<version>
          $sdkRoot = Get-ChildItem "C:\VulkanSDK" -Directory | Select-Object -ExpandProperty FullName -First 1
          if ($sdkRoot) {
            echo "VULKAN_SDK=$sdkRoot" >> $env:GITHUB_ENV
            echo "VK_SDK_PATH=$sdkRoot" >> $env:GITHUB_ENV
          }

      - name: Configure
        run: >
          cmake -B build -S .
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DFFMPEG_ROOT=${{ env.FFMPEG_ROOT }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "build\${{ env.BUILD_TYPE }}\subtitle_generator.exe" dist\
          Copy-Item "build\${{ env.BUILD_TYPE }}\*.dll" dist\ -ErrorAction SilentlyContinue
          Copy-Item README.md dist\
          if (Test-Path LICENSE) { Copy-Item LICENSE dist\ }

      - uses: actions/upload-artifact@v4
        with:
          name: subtitle_generator-windows-x64
          path: dist/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            libavformat-dev libavcodec-dev libavutil-dev libswresample-dev

      - name: Install Vulkan SDK
        run: |
          # Ensure the keyrings directory exists (needed on some Ubuntu runner images)
          sudo mkdir -p /etc/apt/keyrings
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/keyrings/lunarg.asc > /dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-$(lsb_release -cs).list \
            https://packages.lunarg.com/vulkan/lunarg-vulkan-$(lsb_release -cs).list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Package
        run: |
          mkdir -p dist
          cp build/subtitle_generator dist/
          cp README.md dist/
          [ -f LICENSE ] && cp LICENSE dist/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: subtitle_generator-linux-x64
          path: dist/

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install cmake pkg-config ffmpeg

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Package
        run: |
          mkdir -p dist
          cp build/subtitle_generator dist/
          cp README.md dist/
          [ -f LICENSE ] && cp LICENSE dist/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: subtitle_generator-macos-arm64
          path: dist/

  release:
    if: >-
      (startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip platform builds
        run: |
          cd artifacts
          for d in */; do
            name="${d%/}"
            (cd "$name" && zip -r "../${name}.zip" .)
          done

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          files: artifacts/*.zip
          generate_release_notes: true